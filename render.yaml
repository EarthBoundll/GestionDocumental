# Blueprint de Render: crea la API tal como la describe docs/02-arquitectura.md §5.
# Los valores secretos (sync: false) se introducen en el panel de Render al crear el servicio, nunca aquí.
services:
  - type: web
    name: gestion-documental-api
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    # Las migraciones se aplican al compilar. Si fallan, el despliegue se detiene y sigue en línea la
    # versión anterior, en lugar de arrancar una API nueva contra un esquema a medio aplicar.
    # --include=dev: compilar necesita TypeScript, y NODE_ENV=production lo dejaría fuera.
    buildCommand: npm ci --include=dev && npm run build && npm run migrar
    startCommand: npm start
    healthCheckPath: /api/v1/salud
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA
        sync: false
      # Render genera un valor aleatorio de 256 bits al crear el servicio. Cambiarlo cierra todas las sesiones.
      - key: JWT_SECRETO
        generateValue: true
      # La URL del frontend en Vercel, cuando exista.
      - key: CORS_ORIGEN
        sync: false
      # Cloudflare y dos proxies de Render, comprobado con DIAGNOSTICO_RED (docs/07-despliegue.md §5).
      # Si Render cambia su red, se vuelve a medir: DIAGNOSTICO_RED=true y /api/v1/salud/red.
      - key: PROXIES_DE_CONFIANZA
        value: "3"
      - key: DIAGNOSTICO_RED
        value: "false"
      # Archivos en Supabase Storage (D9): bucket privado «documentos».
      - key: ALMACENAMIENTO
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_CLAVE_SECRETA
        sync: false
      - key: STORAGE_BUCKET
        value: documentos
      # El respaldo nocturno de la base (D25), en otro bucket privado.
      - key: RESPALDOS_BUCKET
        value: respaldos
      # Correos de recuperación de contraseña por la API de Brevo (D19), con un remitente verificado allí.
      - key: CORREO
        value: brevo
      - key: BREVO_CLAVE_API
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      - key: CORREO_REMITENTE_NOMBRE
        value: Gestión Documental
      # La URL del frontend en Vercel: el enlace del correo de recuperación apunta allí.
      - key: URL_FRONTEND
        sync: false
